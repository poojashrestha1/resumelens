name: App CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'terraform/**'
      - '.github/workflows/aws-lab.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'terraform/**'
      - '.github/workflows/aws-lab.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: resumelens-app-deploy
  cancel-in-progress: false

jobs:
  # ── CI: runs on every push and pull request ──────────────────────────────
  ci:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -q -r backend/requirements.txt

      - name: Python syntax check
        run: python -m compileall -q backend aws

      - name: Run backend tests
        working-directory: backend
        env:
          APP_MODE: local
        run: pytest test_smoke.py test_roles.py -v --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: cd frontend && npm install --no-audit --no-fund

      - name: Build React (production)
        run: cd frontend && VITE_API_URL='' npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── CD: runs only on push to main (not on PRs) ───────────────────────────
  deploy:
    name: Deploy to EC2
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve AWS resource identifiers
        run: |
          set -euo pipefail
          RELEASE_BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?ends_with(Name, '-releases')].Name | [0]" \
            --output text)
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=careerflow" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          PUBLIC_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=careerflow" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "RELEASE_BUCKET=${RELEASE_BUCKET}" >> $GITHUB_ENV
          echo "INSTANCE_ID=${INSTANCE_ID}"       >> $GITHUB_ENV
          echo "PUBLIC_IP=${PUBLIC_IP}"           >> $GITHUB_ENV
          echo "Resolved: bucket=${RELEASE_BUCKET} instance=${INSTANCE_ID} ip=${PUBLIC_IP}"

      - name: Package and upload release to S3
        run: |
          set -euo pipefail
          tar -czf /tmp/resumelens-release.tgz \
            --exclude='__pycache__' \
            --exclude='.venv' \
            -C . \
            backend \
            aws/resume_parser.py \
            frontend/dist \
            scripts/install_on_ec2.sh
          aws s3 cp /tmp/resumelens-release.tgz "s3://${RELEASE_BUCKET}/release.tgz"
          echo "Release uploaded to s3://${RELEASE_BUCKET}/release.tgz"

      - name: Deploy via SSM
        run: |
          set -euo pipefail

          echo "Waiting for SSM agent on ${INSTANCE_ID}..."
          for i in {1..20}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "None")
            if [[ "$STATUS" == "Online" ]]; then
              echo "SSM agent is online."
              break
            fi
            echo "Attempt $i: SSM status=${STATUS}, retrying in 15s..."
            sleep 15
          done

          if [[ "$STATUS" != "Online" ]]; then
            echo "::error::SSM agent did not come online in time."
            exit 1
          fi

          cat > /tmp/ssm-params.json <<EOF
          {"commands":[
            "set -eu",
            "test -f /etc/careerflow.env && test -f /etc/caddy/Caddyfile",
            "/usr/local/bin/aws s3 cp s3://${RELEASE_BUCKET}/release.tgz /tmp/resumelens-release.tgz",
            "mkdir -p /opt/careerflow && tar -xzf /tmp/resumelens-release.tgz -C /opt/careerflow",
            "bash /opt/careerflow/scripts/install_on_ec2.sh"
          ]}
          EOF

          CMD=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm-params.json \
            --timeout-seconds 900 \
            --comment "ResumeLens deploy - ${{ github.sha }}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${CMD}"

          RESULT="Pending"
          for i in {1..80}; do
            RESULT=$(aws ssm get-command-invocation \
              --command-id "${CMD}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: status=${RESULT}"
            [[ "$RESULT" == "Success" ]] && break
            [[ "$RESULT" == "Failed" || "$RESULT" == "Cancelled" || "$RESULT" == "TimedOut" ]] && break
            sleep 15
          done

          if [[ "$RESULT" != "Success" ]]; then
            echo "::error::SSM deployment failed with status: ${RESULT}"
            echo "--- SSM stdout ---"
            aws ssm get-command-invocation \
              --command-id "${CMD}" \
              --instance-id "${INSTANCE_ID}" \
              --query StandardOutputContent \
              --output text || true
            echo "--- SSM stderr ---"
            aws ssm get-command-invocation \
              --command-id "${CMD}" \
              --instance-id "${INSTANCE_ID}" \
              --query StandardErrorContent \
              --output text || true
            exit 1
          fi

          echo "Deployment successful."

      - name: Health check
        run: |
          set -euo pipefail
          URL="https://${PUBLIC_IP}/api/health"
          echo "Running health check against ${URL}..."
          for i in {1..10}; do
            STATUS=$(curl -fsSLk --max-time 10 "${URL}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok'))" 2>/dev/null || echo "false")
            if [[ "$STATUS" == "True" ]]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i: not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after all retries."
          exit 1
