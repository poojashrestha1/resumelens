name: AWS Lab Deploy or Destroy
on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy provisions infrastructure; destroy removes application resources and data"
        type: choice
        required: true
        options: [deploy, destroy]
permissions:
  id-token: write
  contents: read
concurrency:
  group: careerflow-terraform
  cancel-in-progress: false
jobs:
  terraform:
    # Avoid running privileged Terraform code from unreviewed branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false
      - name: Inspect GitHub OIDC claims
        run: |
          curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq '.value | split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson | {sub, aud}'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Initialize remote state
        working-directory: terraform
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=careerflow/app.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Terraform validate
        working-directory: terraform
        run: terraform fmt -recursive && terraform validate
      - name: Provision
        if: inputs.action == 'deploy'
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
        run: terraform apply -input=false -auto-approve
      - name: Build React
        if: inputs.action == 'deploy'
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Package app and upload to release bucket
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          cd frontend
          npm install --no-audit --no-fund
          VITE_API_URL='' npm run build
          cd ..
          tar -czf /tmp/careerflow-release.tgz --exclude='__pycache__' --exclude='.venv' -C . backend frontend/dist scripts/install_on_ec2.sh
          BUCKET=$(terraform -chdir=terraform output -raw release_bucket)
          aws s3 cp /tmp/careerflow-release.tgz "s3://$BUCKET/release.tgz"
      - name: Wait for SSM and install application
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          ID=$(terraform -chdir=terraform output -raw instance_id)
          BUCKET=$(terraform -chdir=terraform output -raw release_bucket)
          echo "Waiting for cloud-init and SSM on $ID..."
          for i in {1..45}; do
            STATUS=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$ID" --query 'InstanceInformationList[0].PingStatus' --output text)
            if [[ "$STATUS" == "Online" ]]; then break; fi
            sleep 20
          done
          # cloud-init may still be installing packages; the remote script waits for it.
          cat > /tmp/ssm-params.json <<EOF2
          {"commands":["cloud-init status --wait","aws s3 cp s3://$BUCKET/release.tgz /tmp/careerflow-release.tgz","mkdir -p /opt/careerflow && tar -xzf /tmp/careerflow-release.tgz -C /opt/careerflow","bash /opt/careerflow/scripts/install_on_ec2.sh"]}
          EOF2
          CMD=$(aws ssm send-command --instance-ids "$ID" --document-name AWS-RunShellScript --parameters file:///tmp/ssm-params.json --timeout-seconds 900 --query 'Command.CommandId' --output text)
          RESULT="Pending"
          for i in {1..80}; do
            RESULT=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)
            [[ "$RESULT" == "Success" ]] && break
            [[ "$RESULT" == "Failed" || "$RESULT" == "Cancelled" || "$RESULT" == "TimedOut" ]] && break
            sleep 15
          done
          if [[ "$RESULT" != "Success" ]]; then
            aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID"
            exit 1
          fi
          echo "DEPLOYED $(terraform -chdir=terraform output -raw site_url)"
          echo "Create the first admin using scripts/bootstrap_admin.py and Cognito pool $(terraform -chdir=terraform output -raw cognito_pool_id)"
      - name: Destroy application and candidate data
        if: inputs.action == 'destroy'
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
        run: terraform destroy -input=false -auto-approve
